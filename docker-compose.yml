services:
  db:
    image: pgvector/pgvector:pg16
    container_name: financial_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
